[project]
name = "tr-tool"
version = "0.1.0"
description = "Travellers Rest save helper (TR Tool)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
trtool = "trtool.cli:main"

[tool.setuptools]
packages = ["trtool", "trtool.extract"]

[tool.setuptools.package-data]
trtool = ["schema.sql", "catalogue.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
